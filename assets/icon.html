<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Rendered locally to icon-512.png — never served under the CSP. */
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body { background: #0B2B21; }
  svg { display: block; }
</style>
</head>
<body>
<!-- 12% safe padding for maskable: content kept within 62..450 -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0B2B21"/>
  <defs>
    <pattern id="hatch" width="22" height="22" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#C4A44E" stroke-width="5" opacity="0.75"/>
    </pattern>
  </defs>
  <!-- the moratorium wedge rising from the principal baseline -->
  <polygon points="84,392 336,392 336,168 84,344" fill="url(#hatch)"/>
  <!-- capitalisation tick: the taller solid block where EMI begins -->
  <rect x="336" y="118" width="34" height="274" rx="8" fill="#E6D28E"/>
  <!-- amortization path down to zero -->
  <path d="M386 140 C 414 210, 424 310, 430 388" fill="none" stroke="#8FA79A" stroke-width="18" stroke-linecap="round"/>
  <!-- baseline -->
  <line x1="70" y1="392" x2="442" y2="392" stroke="#E6D28E" stroke-width="14" stroke-linecap="round"/>
</svg>
</body>
</html>
